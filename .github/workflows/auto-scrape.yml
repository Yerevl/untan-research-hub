name: Automated Untan Journal Scraper

on:
  schedule:
    # Berjalan otomatis setiap hari Senin pukul 01:00 WIB (18:00 UTC hari Minggu)
    # Anda juga bisa mengubah jadwal cron ini sesuai keinginan
    - cron: '0 18 * * 0'
  # Memungkinkan trigger manual kapan saja dari tab "Actions" di GitHub
  workflow_dispatch:

jobs:
  auto-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Intelligent Auto-Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/auto-sync.ts

